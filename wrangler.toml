name = "alpendre"
main = "worker/index.js"
compatibility_date = "2025-01-01"
# worker-mailer (Gmail SMTP) needs the Node.js compatibility layer.
compatibility_flags = ["nodejs_compat"]

# The dashboard is also served by the Worker itself (handy locally and as a fallback).
[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Alpendre"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Alpendre"]

# Wakes every 5 minutes; the "check every N minutes" setting decides when to actually sync.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Sites allowed to call the owner API from the browser (the GitHub Pages dashboard).
ALLOWED_ORIGINS = "https://inesdias028.github.io"
# Guest emails are sent from this Gmail account (its app password is the GMAIL_APP_PASSWORD secret).
GMAIL_USER = "cabecoentertainment@gmail.com"
