<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpendre · Host dashboard</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Login -->
<section id="login" class="login" hidden>
  <form class="login-card" id="loginForm">
    <img src="/logo.svg" alt="" width="56" height="56">
    <h1>Alpendre</h1>
    <p>Every booking, one porch.</p>
    <label class="field">Password<input type="password" name="password" autocomplete="current-password" autofocus required></label>
    <p class="err" id="loginErr"></p>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</section>

<!-- App -->
<div id="app" class="shell" hidden>
  <aside class="side">
    <a class="brand" href="#overview"><img src="/logo.svg" alt="" width="34" height="34"><span>Alpendre</span></a>
    <nav>
      <a href="#overview" data-view="overview"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Overview</a>
      <a href="#calendar" data-view="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
      <a href="#reservations" data-view="reservations"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Reservations<span class="badge" id="pendingBadge" hidden></span></a>
      <a href="#channels" data-view="channels"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Channels</a>
      <a href="#settings" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Property &amp; site</a>
    </nav>
    <div class="side-foot">
      <a class="btn ghost small" href="/" target="_blank">View guest site ↗</a>
      <button class="btn ghost small" id="logout">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div>
        <h1 id="viewTitle">Overview</h1>
        <p id="viewSub" class="sub"></p>
      </div>
      <div class="top-actions">
        <button class="btn" id="syncBtn" title="Fetch the latest calendars from Airbnb and Booking.com">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Sync now</button>
        <button class="btn primary" id="newBtn">+ New reservation</button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<!-- Drawer -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast"></div>

<script src="admin.js"></script>
</body>
</html>
