<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpendre</title>
<meta name="theme-color" content="#1f2a24">
<meta name="application-name" content="Alpendre">
<!-- iPhone: "Add to Home Screen" opens it full-screen as the Alpendre app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alpendre">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<section id="login" class="login" hidden>
  <form class="login-card" id="loginForm">
    <img src="logo.svg" alt="" width="56" height="56">
    <h1>Alpendre</h1>
    <p>Every booking, one porch.</p>
    <label class="field">Username<input name="login" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus><span class="help">Owner: leave empty and use the owner password.</span></label>
    <label class="field">Password<input type="password" name="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr"></p>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</section>

<div id="app" class="shell" hidden>
  <aside class="side">
    <a class="brand" href="#/"><img src="logo.svg" alt="" width="34" height="34"><span>Alpendre</span></a>
    <nav>
      <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>All houses<span class="badge" id="pendingBadge" hidden></span></a>
    </nav>
    <nav class="mnav" id="mnav"></nav>
    <div class="side-label">Houses</div>
    <div class="houses" id="houseNav"></div>
    <button class="add-house" id="addHouse">+ Add a house</button>
    <div class="side-foot">
      <div class="me" id="me"></div>
      <a class="btn ghost small" href="#/settings">Settings</a>
      <button class="btn ghost small" id="logout">Sign out</button>
    </div>
  </aside>

  <!-- phone layout: top bar, bottom tabs and a + button (hidden on larger screens) -->
  <header class="appbar" id="appbar"></header>
  <main class="main">
    <header class="top">
      <div>
        <div class="crumb" id="crumb"></div>
        <h1 id="viewTitle"></h1>
        <p id="viewSub" class="sub"></p>
      </div>
      <div class="top-actions">
        <button class="btn" id="syncBtn" title="Fetch the latest calendars now">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Sync now</button>
        <button class="btn primary" id="newBtn">+ New reservation</button>
      </div>
    </header>
    <div id="view"></div>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
  <button class="fab" id="fab" aria-label="New reservation"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
